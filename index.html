<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOZA AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#fffafa;
  font-family:Arial,sans-serif;
  color:#641c35;
}

.screen{
  min-height:100vh;
  padding:25px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box{
  width:100%;
  max-width:430px;
  text-align:center;
}

.logo{
  width:90px;
  height:90px;
  margin:auto;
  border-radius:50%;
  background:#641c35;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Georgia,serif;
  font-size:55px;
  font-weight:bold;
}

h1{
  font-size:30px;
  margin:20px 0 8px;
}

.subtitle{
  font-size:20px;
  margin-bottom:25px;
}

button{
  width:100%;
  margin:9px 0;
  padding:16px;
  border:2px solid #641c35;
  border-radius:18px;
  background:white;
  color:#641c35;
  font-size:18px;
  cursor:pointer;
}

button:hover{
  background:#641c35;
  color:white;
}

/* الصفحات الداخلية */

.page{
  display:none;
  min-height:100vh;
  flex-direction:column;
}

.header{
  background:#641c35;
  color:white;
  padding:18px;
  text-align:center;
  font-size:22px;
}

.content{
  width:100%;
  max-width:500px;
  margin:auto;
  padding:25px;
}

.back{
  width:auto;
  padding:10px 18px;
  margin-bottom:20px;
}

textarea,
select,
input{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:1px solid #d5c4c9;
  border-radius:15px;
  font-size:16px;
  font-family:Arial,sans-serif;
}

textarea{
  min-height:150px;
  resize:vertical;
}

.result{
  min-height:100px;
  padding:15px;
  margin-top:12px;
  background:#f5e8eb;
  border-radius:15px;
  text-align:right;
}

/* المحادثة */

.messages{
  flex:1;
  padding:20px;
  overflow-y:auto;
}

.message{
  padding:12px 16px;
  margin:10px 0;
  border-radius:16px;
  max-width:82%;
}

.bot{
  background:#f2e1e6;
  margin-left:auto;
}

.user{
  background:#641c35;
  color:white;
  margin-right:auto;
}

.chat-input{
  display:flex;
  gap:8px;
  padding:12px;
  border-top:1px solid #ddd;
}

.chat-input input{
  margin:0;
  flex:1;
}

.send{
  width:80px;
  margin:0;
}
</style>
</head>

<body>

<!-- الرئيسية -->

<div class="screen" id="home">

  <div class="box">

    <div class="logo">H</div>

    <h1>HOZA AI</h1>

    <div class="subtitle">واش راك حاب نديرو؟</div>

    <button onclick="openChat()">💬 نهدرو</button>

    <button onclick="openTranslator()">🌐 نترجمو</button>

    <button onclick="openWriter()">✍️ نكتبو</button>

    <button onclick="openCreative()">✨ صور و إبداع</button>

  </div>

</div>


<!-- المحادثة -->

<div class="page" id="chat">

  <div class="header">HOZA AI</div>

  <div class="messages" id="messages">

    <div class="message bot">
      سلام 👋 أنا HOZA AI، واش حابة تهدري معايا؟
    </div>

  </div>

  <div class="chat-input">

    <input
      id="userInput"
      type="text"
      placeholder="اكتبي رسالتك..."
      onkeydown="if(event.key==='Enter') sendMessage()"
    >

    <button class="send" onclick="sendMessage()">إرسال</button>

  </div>

</div>


<!-- الترجمة -->

<div class="page" id="translator">

  <div class="header">🌐 الترجمة</div>

  <div class="content">

    <button class="back" onclick="goHome()">← رجوع</button>

    <select id="fromLang">
      <option>العربية</option>
      <option>Français</option>
      <option>English</option>
      <option>Türkçe</option>
    </select>

    <textarea
      id="translationInput"
      placeholder="اكتبي النص اللي حابة تترجميه..."
    ></textarea>

    <select id="toLang">
      <option>Français</option>
      <option>English</option>
      <option>العربية</option>
      <option>Türkçe</option>
    </select>

    <button onclick="translateDemo()">ترجمة</button>

    <div class="result" id="translationResult">
      الترجمة تظهر هنا...
    </div>

  </div>

</div>


<!-- الكتابة -->

<div class="page" id="writer">

  <div class="header">✍️ الكتابة</div>

  <div class="content">

    <button class="back" onclick="goHome()">← رجوع</button>

    <textarea
      id="writingInput"
      placeholder="اكتبي واش حابة نعاونك تكتبي..."
    ></textarea>

    <button onclick="writeDemo()">إنشاء النص</button>

    <div class="result" id="writingResult">
      النص يظهر هنا...
    </div>

  </div>

</div>


<!-- الإبداع -->

<div class="page" id="creative">

  <div class="header">✨ صور وإبداع</div>

  <div class="content">

    <button class="back" onclick="goHome()">← رجوع</button>

    <textarea
      placeholder="اكتبي فكرة الصورة اللي حابة..."
    ></textarea>

    <button onclick="creativeDemo()">ابدئي الإبداع</button>

    <div class="result">
      قسم الصور والإبداع قيد التطوير ✨
    </div>

  </div>

</div>


<script>

function hideAll(){

  document.getElementById("home").style.display="none";
  document.getElementById("chat").style.display="none";
  document.getElementById("translator").style.display="none";
  document.getElementById("writer").style.display="none";
  document.getElementById("creative").style.display="none";

}


function goHome(){

  hideAll();

  document.getElementById("home").style.display="flex";

}


function openChat(){

  hideAll();

  document.getElementById("chat").style.display="flex";

}


function openTranslator(){

  hideAll();

  document.getElementById("translator").style.display="flex";

}


function openWriter(){

  hideAll();

  document.getElementById("writer").style.display="flex";

}


function openCreative(){

  hideAll();

  document.getElementById("creative").style.display="flex";

}


function sendMessage(){

  const input=document.getElementById("userInput");
  const text=input.value.trim();

  if(text==="") return;

  const messages=document.getElementById("messages");

  const userMessage=document.createElement("div");

  userMessage.className="message user";
  userMessage.textContent=text;

  messages.appendChild(userMessage);

  input.value="";

  setTimeout(function(){

    const botMessage=document.createElement("div");

    botMessage.className="message bot";

    botMessage.textContent=
      "وصلتني رسالتك 💗 قريبًا نربط HOZA بالذكاء الاصطناعي الحقيقي.";

    messages.appendChild(botMessage);

    messages.scrollTop=messages.scrollHeight;

  },500);

}


function translateDemo(){

  const text=document.getElementById("translationInput").value;

  const result=document.getElementById("translationResult");

  if(text.trim()===""){

    result.textContent="اكتبي النص أولاً.";

  }else{

    result.textContent=
      "وصل النص! الترجمة الحقيقية نربطوها في المرحلة القادمة بالذكاء الاصطناعي.";

  }

}


function writeDemo(){

  const text=document.getElementById("writingInput").value;

  const result=document.getElementById("writingResult");

  if(text.trim()===""){

    result.textContent="اكتبي الفكرة أولاً.";

  }else{

    result.textContent=
      "فهمت فكرتك! مولّد الكتابة الحقيقي نربطوه بالذكاء الاصطناعي في المرحلة القادمة.";

  }

}


function creativeDemo(){

  alert("✨ قسم الصور والإبداع قيد التطوير");

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOZA AI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#fffafa;
  font-family:Arial,sans-serif;
  color:#641c35;
}

.home{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:25px;
}

.box{
  width:100%;
  max-width:420px;
  text-align:center;
}

.logo{
  width:90px;
  height:90px;
  margin:auto;
  border-radius:50%;
  background:#641c35;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Georgia,serif;
  font-size:55px;
  font-weight:bold;
}

h1{
  font-size:30px;
  margin:20px 0 8px;
}

p{
  font-size:20px;
  margin-bottom:25px;
}

button{
  width:100%;
  margin:10px 0;
  padding:17px;
  border:2px solid #641c35;
  border-radius:18px;
  background:white;
  color:#641c35;
  font-size:18px;
  cursor:pointer;
}

button:hover{
  background:#641c35;
  color:white;
}

/* Chat */

.chat{
  display:none;
  min-height:100vh;
  flex-direction:column;
}

.header{
  padding:18px;
  background:#641c35;
  color:white;
  font-size:22px;
  text-align:center;
}

.messages{
  flex:1;
  padding:20px;
  overflow-y:auto;
}

.message{
  padding:12px 16px;
  margin:10px 0;
  border-radius:16px;
  max-width:80%;
}

.bot{
  background:#f2e1e6;
  margin-left:auto;
}

.user{
  background:#641c35;
  color:white;
  margin-right:auto;
}

.input-area{
  display:flex;
  padding:12px;
  gap:8px;
  border-top:1px solid #ddd;
}

input{
  flex:1;
  padding:14px;
  border:1px solid #ccc;
  border-radius:15px;
  font-size:16px;
}

.send{
  width:80px;
  margin:0;
  padding:10px;
}
</style>
</head>

<body>

<!-- الصفحة الرئيسية -->

<div class="home" id="home">

  <div class="box">

    <div class="logo">H</div>

    <h1>HOZA AI</h1>

    <p>واش راك حاب نديرو؟</p>

    <button onclick="openChat()">💬 نهدرو</button>

    <button>🌐 نترجمو</button>

    <button>✍️ نكتبو</button>

    <button>✨ صور و إبداع</button>

  </div>

</div>


<!-- المحادثة -->

<div class="chat" id="chat">

  <div class="header">
    HOZA AI
  </div>

  <div class="messages" id="messages">

    <div class="message bot">
      سلام 👋 أنا HOZA AI، واش حابة تهدري معايا؟
    </div>

  </div>

  <div class="input-area">

    <input
      id="userInput"
      type="text"
      placeholder="اكتبي رسالتك..."
      onkeydown="if(event.key==='Enter') sendMessage()"
    >

    <button class="send" onclick="sendMessage()">
      إرسال
    </button>

  </div>

</div>


<script>

function openChat(){

  document.getElementById("home").style.display="none";

  document.getElementById("chat").style.display="flex";

}


function sendMessage(){

  const input=document.getElementById("userInput");

  const text=input.value.trim();

  if(text==="") return;

  const messages=document.getElementById("messages");

  const userMessage=document.createElement("div");

  userMessage.className="message user";

  userMessage.textContent=text;

  messages.appendChild(userMessage);

  input.value="";

  setTimeout(function(){

    const botMessage=document.createElement("div");

    botMessage.className="message bot";

    botMessage.textContent=
      "وصلتني رسالتك 💗 في النسخة القادمة نربط HOZA بالذكاء الاصطناعي الحقيقي.";

    messages.appendChild(botMessage);

    messages.scrollTop=messages.scrollHeight;

  },500);

}

</script>

</body>
</html>
